<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14"/>
      <stop offset="100%" style="stop-color:#161E29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)"/>
  <!-- Main "L" letter stylized as connection arrows -->
  <!-- Left node -->
  <circle cx="180" cy="180" r="32" fill="url(#accent)"/>
  <!-- Right node -->
  <circle cx="332" cy="332" r="32" fill="url(#accent)"/>
  <!-- Connection line (diagonal) -->
  <line x1="205" y1="205" x2="307" y2="307" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 16"/>
  <!-- Top right node (small) -->
  <circle cx="332" cy="180" r="20" fill="#22D3EE" opacity="0.4"/>
  <!-- Bottom left node (small) -->
  <circle cx="180" cy="332" r="20" fill="#6366F1" opacity="0.4"/>
  <!-- Horizontal connection -->
  <line x1="212" y1="180" x2="312" y2="180" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <!-- Vertical connection -->
  <line x1="180" y1="212" x2="180" y2="312" stroke="#6366F1" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <!-- Data transfer arrows -->
  <path d="M 240 240 L 270 255 L 240 270 Z" fill="#22D3EE" opacity="0.8"/>
  <path d="M 280 246 L 250 261 L 280 276 Z" fill="#6366F1" opacity="0.6"/>
</svg>
